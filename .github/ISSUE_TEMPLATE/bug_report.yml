name: Bug Report
description: File a bug report to help us improve the project
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed Behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Run command '...'
        2. See error '...'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and Diagnostics
      description: Relevant logs, stack traces, or terminal output.
      render: shell
  - type: textarea
    id: system
    attributes:
      label: System & Environment Information
      description: OS version, Go/Nix versions, etc.
      placeholder: |
        - OS: [e.g. Linux / macOS]
        - Go Version: [e.g. 1.27]
    validations:
      required: true
